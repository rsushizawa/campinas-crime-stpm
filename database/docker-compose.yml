# PostGIS warehouse of campinas-crime-stpm (`make db`).
#
# The image is pinned by digest: PostgreSQL 17.5 with PostGIS 3.5.2, so a rebuild
# years from now runs the same database engine.
#
# The host port defaults to 5433 (5432 is often taken by another PostgreSQL);
# override with PGPORT. The password is never stored here: set POSTGRES_PASSWORD
# in the environment or in the repository's .env (copy .env.example). The schema
# is applied by `make load` (database/schema.sql), not at container start, so
# every load rebuilds the release from scratch.
name: ${COMPOSE_PROJECT_NAME:-campinas-crime-stpm}
services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    container_name: ${CRIME_DB_CONTAINER:-campinas_crime_db}
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: crime_db
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - crime_data:/var/lib/postgresql/data

volumes:
  crime_data:
