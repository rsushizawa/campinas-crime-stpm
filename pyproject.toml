[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campinas-crime-stpm"
dynamic = ["version"]
description = "Classical space-time pattern mining (Esri-style) of police-recorded crime in Campinas, SP"
requires-python = ">=3.11"
dependencies = [
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "libpysal==4.12.1",
    "esda==2.6.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "statsmodels==0.15.0",
    "matplotlib==3.10.6",
    "pyogrio==0.13.0",             # read directly (CNEFE GeoJSON, crime.data.cleaning)
    "pyarrow>=15",                 # result artifacts (parquet)
]

[project.optional-dependencies]
# acquire / clean / validate stages (scripts/01_acquire … 03_test)
etl = ["geobr>=0.2", "pandera>=0.20", "python-calamine>=0.2"]
# PostGIS warehouse: load_database.py, validate_data.py (with DB), crime.load_sectors / load_grid ...
db = ["SQLAlchemy==2.0.43", "psycopg2-binary==2.9.12"]
# interactive maps (plotly) and web basemaps (contextily) in crime.viz
viz = ["plotly==6.8.0", "contextily>=1.6"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["campinas-crime-stpm[etl,db,viz]"]

[tool.setuptools.packages.find]
include = ["crime*", "etl*"]

[tool.setuptools.dynamic]
version = { attr = "crime.core.config.__version__" }

[tool.setuptools.package-data]
crime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the PostGIS database (make db); skipped when it is unreachable"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".vibe-wise"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "E701", "E702", "E741"]   # existing compact style; `I` = Moran's I
