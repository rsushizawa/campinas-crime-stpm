[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campinas-crime-stpm"
dynamic = ["version"]
description = "Reproducible geospatial data treatment, PostGIS, space-time analysis and publication exports"
requires-python = ">=3.12"
dependencies = [
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "libpysal==4.12.1",
    "esda==2.6.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "statsmodels==0.15.0",
    "matplotlib==3.10.6",
    "pyogrio==0.13.0",             # read directly (CNEFE GeoJSON, crime/geoprocessor/census.py)
    "pyarrow>=15",                 # parquet (cleaned bulletins, tract-attribute cache)
    # --- analysis libraries the notebooks call directly
    "pymannkendall>=1.4.3",
    "contextily>=1.7.1",           # basemap tiles under the maps (crime/visualizer/mapstyle.py)
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
etl = ["geobr>=0.2", "pandera>=0.20", "python-calamine>=0.2"]
# PostGIS warehouse: the load stage and crime.warehouse.Warehouse
db = ["SQLAlchemy==2.0.43", "psycopg2-binary==2.9.12"]
dev = ["ruff>=0.6"]
all = ["campinas-crime-stpm[etl,db]"]
verification = ['google-cloud-bigquery>=3', 'db-dtypes>=1']

[project.scripts]
crime = "crime.cli:main"
crime-verify = "crime.validation.reconciliation:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crime*"]

[tool.setuptools.dynamic]
version = { attr = "crime.config.__version__" }

[tool.setuptools.package-data]
crime = ["py.typed"]
"crime.warehouse" = ["schema.sql"]
"crime.downloader" = ["*.sha256"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".vibe-wise"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731", "E701", "E702", "E741"]   # existing compact style; `I` = Moran's I

[tool.ruff.lint.per-file-ignores]
# notebooks are linted too (ruff reads .ipynb); imports may sit in the cell that first needs them
"notebooks/*.ipynb" = ["E402"]
